apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  labels:
    app: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate # volume ReadWriteOnce, pas de double montage pendant un rollout
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec: # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
      # Image officielle non concue pour tourner en non-root par defaut
      # (ecrit dans /app au demarrage) ; a revoir si une image alternative
      # non-root apparait.
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:1
          ports:
            - containerPort: 3001
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
