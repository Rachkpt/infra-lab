---
- name: Verifier si Promtail est deja installe
  ansible.builtin.stat:
    path: /usr/local/bin/promtail
  register: promtail_bin

- name: Telecharger et installer Promtail
  when: not promtail_bin.stat.exists
  block:
    - name: Installer unzip
      ansible.builtin.apt:
        name: unzip
        state: present

    - name: Telecharger l'archive Promtail
      ansible.builtin.get_url:
        url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
        dest: /tmp/promtail.zip
        mode: "0644"

    - name: Extraire l'archive
      ansible.builtin.unarchive:
        src: /tmp/promtail.zip
        dest: /tmp
        remote_src: true

    - name: Installer le binaire dans /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/promtail-linux-amd64
        dest: /usr/local/bin/promtail
        mode: "0755"
        remote_src: true

- name: Creer les dossiers de config et de donnees
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/promtail
    - /var/lib/promtail

- name: Deployer la config Promtail
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/promtail/config.yml
    mode: "0644"
  notify: Restart promtail

- name: Deployer le service systemd
  ansible.builtin.template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service
    mode: "0644"
  notify: Restart promtail

- name: Activer et demarrer Promtail
  ansible.builtin.systemd:
    name: promtail
    enabled: true
    state: started
    daemon_reload: true
