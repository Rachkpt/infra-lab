---
# Necessite que le role k3s_server ait tourne sur k3s-master dans la meme
# invocation de playbook (voir playbooks/k3s.yml), pour exposer
# hostvars['k3s-master']['k3s_node_token'].

- name: Installer k3s (agent)
  ansible.builtin.shell: >
    set -o pipefail &&
    curl -sfL https://get.k3s.io |
    K3S_URL=https://{{ hostvars['k3s-master']['private_ip'] }}:6443
    K3S_TOKEN={{ hostvars['k3s-master']['k3s_node_token'] }}
    sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
