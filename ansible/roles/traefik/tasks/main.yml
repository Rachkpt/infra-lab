---
- name: Verifier si Traefik est deja installe
  ansible.builtin.stat:
    path: /usr/local/bin/traefik
  register: traefik_bin

- name: Telecharger et installer Traefik
  when: not traefik_bin.stat.exists
  block:
    - name: Telecharger l'archive Traefik
      ansible.builtin.get_url:
        url: "https://github.com/traefik/traefik/releases/download/v{{ traefik_version }}/traefik_v{{ traefik_version }}_linux_amd64.tar.gz"
        dest: /tmp/traefik.tar.gz
        mode: "0644"

    - name: Extraire l'archive
      ansible.builtin.unarchive:
        src: /tmp/traefik.tar.gz
        dest: /tmp
        remote_src: true

    - name: Installer le binaire dans /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/traefik
        dest: /usr/local/bin/traefik
        mode: "0755"
        remote_src: true

- name: Creer le dossier de configuration
  ansible.builtin.file:
    path: /etc/traefik
    state: directory
    mode: "0755"

- name: Deployer la config statique (pas de secrets dedans)
  ansible.builtin.copy:
    src: traefik.yml
    dest: /etc/traefik/traefik.yml
    mode: "0644"
  notify: Restart traefik

- name: Deployer la config dynamique (dashboard + auth)
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: /etc/traefik/dynamic.yml
    mode: "0644"
  notify: Restart traefik

- name: Deployer le service systemd
  ansible.builtin.copy:
    src: traefik.service
    dest: /etc/systemd/system/traefik.service
    mode: "0644"
  notify: Restart traefik

- name: Activer et demarrer Traefik
  ansible.builtin.systemd:
    name: traefik
    enabled: true
    state: started
    daemon_reload: true
