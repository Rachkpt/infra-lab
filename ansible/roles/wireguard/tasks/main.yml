---
# Ce role s'execute sur wg-gateway ET proxmox dans la meme invocation de
# playbook (voir playbooks/wireguard.yml), car chaque cote a besoin de
# la cle publique de l'autre pour se configurer. Les cles sont generees
# une seule fois sur chaque hote (idempotent via `creates`) puis exposees
# en tant que fact partage via hostvars.

- name: Installer WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: true

- name: Verifier si une paire de cles existe deja
  ansible.builtin.stat:
    path: /etc/wireguard/privatekey
  register: wg_privatekey_stat

- name: Generer une paire de cles WireGuard
  ansible.builtin.shell: |
    set -eo pipefail
    umask 077
    wg genkey | tee /etc/wireguard/privatekey | wg pubkey > /etc/wireguard/publickey
  args:
    executable: /bin/bash
    creates: /etc/wireguard/privatekey

- name: Lire la cle privee generee
  ansible.builtin.slurp:
    src: /etc/wireguard/privatekey
  register: wg_privatekey_raw

- name: Lire la cle publique generee
  ansible.builtin.slurp:
    src: /etc/wireguard/publickey
  register: wg_publickey_raw

- name: Exposer les cles comme facts partages entre hotes
  ansible.builtin.set_fact:
    wg_private_key: "{{ wg_privatekey_raw.content | b64decode | trim }}"
    wg_public_key: "{{ wg_publickey_raw.content | b64decode | trim }}"

- name: Deployer wg0.conf (role gateway, sur wg-gateway)
  ansible.builtin.template:
    src: wg0-gateway.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  when: wireguard_mode == "gateway"
  notify: Restart wireguard

- name: Deployer wg0.conf (role routeur local, sur Proxmox)
  ansible.builtin.template:
    src: wg0-proxmox.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  when: wireguard_mode == "proxmox_router"
  notify: Restart wireguard

- name: Activer l'IP forwarding de maniere persistante
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-wireguard-forward.conf
    content: "net.ipv4.ip_forward=1\n"
    mode: "0644"
  notify: Apply sysctl

- name: Activer et demarrer wg-quick@wg0
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
