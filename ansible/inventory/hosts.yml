all:
  children:
    aws:
      vars:
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ playbook_dir }}/../../terraform/aws/infra-lab-key.pem"
      hosts:
        wg-gateway:
          ansible_host: 35.180.240.51 # Elastic IP, stable
          private_ip: 10.0.1.177
          wireguard_mode: gateway # peut changer si l'instance est recreee
        monitoring:
          ansible_host: 35.180.110.246 # IP publique dynamique, verifier apres un `terraform apply`
          private_ip: 10.0.1.45
        runner-ci:
          ansible_host: 13.38.105.7 # IP publique dynamique, verifier apres un `terraform apply`
          private_ip: 10.0.1.67

    proxmox_vms:
      vars:
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ playbook_dir }}/../../terraform/proxmox/infra-lab-proxmox-key.pem"
      hosts:
        k3s-master:
          ansible_host: 10.10.10.10
          private_ip: 10.10.10.10
        k3s-worker:
          ansible_host: 10.10.10.11
          private_ip: 10.10.10.11
        infra:
          ansible_host: 10.10.10.12
          private_ip: 10.10.10.12

    # Hyperviseur Proxmox lui-meme (pour le cote local du tunnel WireGuard).
    # Pas de cle dediee : ajouter la cle publique de la machine qui lance
    # Ansible dans /root/.ssh/authorized_keys sur Proxmox (une seule fois).
    proxmox_host:
      hosts:
        proxmox:
          ansible_host: 192.168.173.134 # IP de Proxmox sur le reseau VMware NAT, a verifier
          ansible_user: root
          wireguard_mode: proxmox_router

    k3s_masters:
      hosts:
        k3s-master:

    k3s_workers:
      hosts:
        k3s-worker:

    monitored: # toutes les VMs qui recoivent node_exporter + promtail
      children:
        aws:
        proxmox_vms:
